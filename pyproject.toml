[project]
name = "minecraft-playerdata-to-level"
version = "0.1.0"
description = "Copy Minecraft playerdata NBT into a level.dat Player compound"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "nbtlib>=2.0.4",
]

[project.scripts]
minecraft-playerdata-to-level = "minecraft_playerdata_to_level.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
